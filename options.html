<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Pelu Assistant - Settings</title>
    <link rel="stylesheet" href="options.css">
</head>
<body>
    <div class="container">
        <h2>Pelu Assistant</h2>

        <h3>Basic Info</h3>
        <div class="form-grid">
            <div class="form-group">
                <label for="firstName">First Name:</label>
                <input type="text" id="firstName">
            </div>
            <div class="form-group">
                <label for="lastName">Last Name:</label>
                <input type="text" id="lastName">
            </div>
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email">
            </div>
            <div class="form-group">
                <label for="phone">Phone:</label>
                <input type="text" id="phone">
            </div>
        </div>

        <h3>Text Arsenal</h3>
        <div class="text-block">
            <label>Professional Summary</label>
            <div class="language-columns">
                <div class="column">
                    <h4>Spanish</h4>
                    <textarea id="summary_es" rows="6"></textarea>
                </div>
                <div class="column">
                    <h4>English</h4>
                    <textarea id="summary_en" rows="6"></textarea>
                </div>
            </div>
        </div>
        <div class="text-block">
            <label>Experience (Accenture)</label>
            <div class="language-columns">
                <div class="column">
                    <h4>Spanish</h4>
                    <textarea id="experience_es" rows="8"></textarea>
                </div>
                <div class="column">
                    <h4>English</h4>
                    <textarea id="experience_en" rows="8"></textarea>
                </div>
            </div>
        </div>
        
        <h3>Key Dates (Visual Reference Only)</h3>
        <table>
            <thead>
                <tr>
                    <th>Experience / Study</th>
                    <th>Start Date</th>
                    <th>End Date</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Accenture</td>
                    <td>01/03/2023</td>
                    <td>16/08/2025</td>
                </tr>
                <tr>
                    <td>Henry (Group Project)</td>
                    <td>01/05/2022</td>
                    <td>01/08/2022</td>
                </tr>
            </tbody>
        </table>

        <button id="saveButton">Save Configuration</button>
        <p id="status"></p>
    </div>
    <script src="options.js"></script>
</body>
</html>
